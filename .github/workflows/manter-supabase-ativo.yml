# Mantém o projeto Supabase do AquaAlerta ativo.
# O plano gratuito pausa projetos com pouca atividade em 7 dias; esta
# tarefa faz uma leitura simples a cada 3 dias. Agendamentos do GitHub só
# rodam na branch padrão (main). Para rodar na hora: aba Actions > Run workflow.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 13 */3 * *"   # a cada 3 dias, 09:17 em Manaus
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler o banco
        env:
          # Chave pública (anon), a mesma que já está no app (lib/main.dart).
          # Os dados continuam protegidos pelas regras de RLS do banco.
          SUPABASE_URL: https://gayykjlkdtmmzovdbjkb.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdheXlramxrZHRtbXpvdmRiamtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NjI5NjQsImV4cCI6MjA5NTMzODk2NH0.0_NJrYR5NvoWDlMS3qpjnSGdsthWwhqgWDFPetHCIgI
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/monitored_regions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Resposta do Supabase: $status"
          test "$status" = "200"
