name: aqualerta
description: Plataforma de monitoramento de enchentes em tempo real.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^17.2.3

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_geojson: ^1.0.3

  # Local Storage / Cache
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.0

  # Push Notifications
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2
  percent_indicator: ^4.2.3

  # Utilities
  intl: ^0.20.2
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1

  # DI
  get_it: ^9.2.1

  # Functional
  dartz: ^0.10.1

  cupertino_icons: ^1.0.8
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/
    - assets/logos/

  fonts:
    # Fonte da v3: feita para pessoas com baixa visão (licença OFL em assets/fonts)
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
